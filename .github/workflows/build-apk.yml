name: Build APK

# Lancement manuel (onglet Actions → Build APK → Run workflow)
# ou automatique à chaque push sur master.
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Fichiers de config Firebase (gitignorés) réinjectés depuis les secrets.
      - name: Restaurer google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Restaurer firebase_options.dart
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 -d > lib/firebase_options.dart

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Version FIGÉE, et pas « la dernière stable ». Le 15.08.2026, le canal
      # stable est passé en 3.47.0, qui a transformé en ERREURS bloquantes ce
      # qui n'était encore que des avertissements en 3.44.9 : Gradle < 8.14,
      # AGP < 8.11.1, Kotlin < 2.2.20. Résultat, le build APK ne passait plus
      # du tout — sans qu'une seule ligne du projet ait bougé.
      # Remonter cette version demande de mettre à jour Gradle + AGP + Kotlin
      # ensemble, et de retester un APK réel avant de le publier : à faire
      # posément, pas au milieu d'une livraison.
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      # Clé de signature fixe (keystore PKCS12) injectée depuis les secrets.
      - name: Restaurer le keystore de signature
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/carnet-release.p12"

      - name: Dépendances
        run: flutter pub get

      # Le numéro de build (visible dans l'app sur l'écran de connexion,
      # "v1.0.0 (N)") ne bougeait jamais (fixé à 1 dans pubspec.yaml) — donc
      # aucun moyen de vérifier qu'un téléphone a bien la dernière version.
      # On force le numéro de run GitHub Actions (toujours croissant, unique).
      - name: Build APK release (signé)
        run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/carnet-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # Empreinte SHA-1/SHA-256 de la clé de signature release — à enregistrer
      # dans Firebase (Paramètres du projet → app Android → Ajouter une
      # empreinte) pour que Google Sign-In fonctionne sur l'APK signé
      # distribué (google-services.json a un oauth_client vide tant qu'aucune
      # empreinte n'y est associée → Google Sign-In échoue systématiquement).
      # Une empreinte n'est pas un secret (c'est justement ce qu'on donne à
      # Google), donc l'afficher en clair dans les logs ne pose pas de risque.
      - name: Empreinte de la clé de signature (diagnostic Google Sign-In)
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/carnet-release.p12" \
            -storetype PKCS12 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            | grep -E "SHA1:|SHA256:"

      - name: Publier l'APK (artefact GitHub Actions, 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: carnet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Publie aussi l'APK sur dmathys.dev/download/carnet.apk (rewrite Vercel
      # vers ce fichier sur Firebase Storage, voir landing/vercel.json) — sans
      # cette étape, ce lien restait figé sur le tout premier build tant que
      # personne ne le remplaçait à la main (gsutil cp ... gs://.../public/carnet.apk).
      - name: Authentification Google Cloud (service account Firebase)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Renommer l'APK pour publication
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/carnet.apk

      - name: Publier sur dmathys.dev/download/carnet.apk
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: build/app/outputs/flutter-apk/carnet.apk
          destination: bloom-bcb1f.firebasestorage.app/public
