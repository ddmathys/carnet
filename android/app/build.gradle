plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) { flutterVersionCode = '1' }

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) { flutterVersionName = '1.0' }

android {
    namespace "ch.gravendev.bloom"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ch.gravendev.bloom"
        // flutter_gemma / MediaPipe LLM exige minSdk 24.
        minSdkVersion 24
        // Aligné sur compileSdkVersion — Google Play exige un targetSdk proche
        // de la dernière version Android (fenêtre qui remonte chaque année
        // fin août) ; y rester en retard bloque l'envoi d'un nouvel APK/AAB.
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def hasReleaseKey = System.getenv("ANDROID_KEYSTORE_PATH") != null
            if (!hasReleaseKey) {
                // Avant : ce repli était totalement silencieux — un build
                // "release" pouvait finir signé avec la clé DEBUG sans que
                // rien ne le signale, dangereux si ce build est ensuite
                // distribué (jamais valide pour Google Play). Le repli reste
                // (pratique pour un build local rapide sans la vraie clé),
                // mais devient visible.
                println "⚠️  ANDROID_KEYSTORE_PATH absent — build 'release' signé avec la clé DEBUG (jamais valide pour Google Play)."
            }
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
    // ShortcutManagerCompat : les raccourcis de partage (« Ajouter à Léa ») de
    // la rangée de suggestions. Version compatible compileSdk 34+.
    implementation "androidx.core:core-ktx:1.13.1"
}
